{% extends 'base.html' %}
{% load static %}

{% block content %}
<header class="masthead bg-index text-white text-center py-4">
  <div class="container d-flex align-items-center flex-column pt-2">
    <h2>Local Popularity Map</h2>
    <p>Discover what's popular in your area!</p>
  </div>
</header>

<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto text-center mb-3">
        <div class="card">
          <div class="card-header">
            <h4>Movie Popularity by Location</h4>
          </div>
          <div class="card-body">
            <div id="map" style="height: 500px; width: 100%;"></div>
            <small class="text-muted d-block mt-2">
              Click any state to view its top purchased movies.
            </small>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h5>Popular Movies by State</h5>
          </div>
          <div class="card-body">
            <div class="row" id="state-movies">
              <!-- Filled when a state is clicked -->
              <div class="col-12">
                <div class="alert alert-info mb-0">
                  Select a state on the map to see results here.
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>

<!-- Leaflet JS -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<!-- GeoJSON for U.S. states (provides window.statesData) -->
<script src="https://leafletjs.com/examples/choropleth/us-states.js"></script>

<script>
// Initialize the map centered on the US
var map = L.map('map').setView([39.8283, -98.5795], 4);

// Add OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

// State name -> USPS code (50 states)
const NAME_TO_CODE = {
  "Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT",
  "Delaware":"DE","District of Columbia":"DC","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL",
  "Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA",
  "Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV",
  "New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND",
  "Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD",
  "Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"
};

const stateMoviesContainer = document.getElementById('state-movies');

function renderPanel(stateCode, items) {
  stateMoviesContainer.innerHTML = '';
  const col = document.createElement('div');
  col.className = 'col-12';

  const list = (items || []).map(row => `
    <li class="list-group-item d-flex justify-content-between align-items-center">
      ${row.name}
      <span class="badge bg-primary rounded-pill">${row.count}</span>
    </li>
  `).join('') || '<li class="list-group-item">No purchases found.</li>';

  col.innerHTML = `
    <div class="card h-100">
      <div class="card-header">
        <h6 class="mb-0">Top Movies in ${stateCode}</h6>
      </div>
      <div class="card-body">
        <ul class="list-group list-group-flush">
          ${list}
        </ul>
      </div>
    </div>
  `;
  stateMoviesContainer.appendChild(col);
}

async function fetchTopMovies(stateCode) {
  const res = await fetch(`/api/top_movies_by_state/?state=${encodeURIComponent(stateCode)}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json(); // [{name, count}]
}

function popupHTML(stateName, stateCode, items) {
  const lis = (items || []).map(r => `<li>${r.name} — ${r.count}</li>`).join('') || '<li>No purchases found.</li>';
  return `
    <div>
      <h6 class="mb-1">${stateName} (${stateCode})</h6>
      <p class="mb-1"><strong>Top Purchased:</strong></p>
      <ul class="mb-0">${lis}</ul>
    </div>`;
}

function style(feature) {
  return {
    weight: 1,
    opacity: 1,
    color: '#666',
    fillOpacity: 0.15,
    fillColor: '#3388ff'
  };
}

function highlightFeature(e) {
  const layer = e.target;
  layer.setStyle({ weight: 2, color: '#000', fillOpacity: 0.25 });
  if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
    layer.bringToFront();
  }
}

function resetHighlight(e) {
  geojson.resetStyle(e.target);
}

async function onStateClick(e) {
  const stateName = e.target.feature.properties.name;
  const stateCode = NAME_TO_CODE[stateName];
  if (!stateCode) {
    e.target.bindPopup(`<div><strong>${stateName}</strong><br/>No state code mapping.</div>`).openPopup();
    return;
  }
  try {
    const data = await fetchTopMovies(stateCode);
    renderPanel(stateCode, data);
    e.target.bindPopup(popupHTML(stateName, stateCode, data)).openPopup();
  } catch (err) {
    console.error(err);
    e.target.bindPopup(`<div><strong>${stateName} (${stateCode})</strong><br/>Error loading data.</div>`).openPopup();
  }
}

function onEachFeature(feature, layer) {
  layer.on({
    mouseover: highlightFeature,
    mouseout: resetHighlight,
    click: onStateClick
  });
}

// Draw states layer (statesData is defined by the us-states.js script)
var geojson = L.geoJson(statesData, {
  style: style,
  onEachFeature: onEachFeature
}).addTo(map);
</script>
{% endblock content %}
